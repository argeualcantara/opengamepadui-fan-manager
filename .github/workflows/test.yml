name: Test

# Runs the standalone GUT harness under tests/ (see tests/project.godot's
# header comment for what it is and why it exists) against every push/PR.
# Godot itself and the GUT addon are never committed to this repo. Godot
# is cached across runs (downloaded fresh below on a cache miss); GUT
# setup and the actual test run both go through tests/run-tests.sh, so
# there's a single place that knows how to assemble the harness instead
# of duplicating that logic here.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot download
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extracted
          mv /tmp/godot-extracted/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Set up test harness (GUT addon + plugin symlink)
        run: GODOT_BIN=~/godot-bin/godot ./tests/run-tests.sh --setup-only

      - name: Import project (populates the global script class cache)
        run: ~/godot-bin/godot --headless --editor --quit --path tests

      - name: Run tests
        run: GODOT_BIN=~/godot-bin/godot ./tests/run-tests.sh
