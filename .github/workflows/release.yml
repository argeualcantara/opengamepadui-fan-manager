name: Release

# Every push to main cuts a new release: no Conventional Commits needed,
# normally just "latest tag + 1 patch". Bumping plugin.json's
# major/minor by hand ahead of the tags restarts the series from
# exactly that value instead (see "Compute next version" below) - that's
# the only thing plugin.json's version actually controls, it's never
# committed back here (that would just trigger another release). Add
# "[skip release]" to a commit message (e.g. a docs-only change) to
# skip cutting a release for that push.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: needed for the version/notes diff below

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          base_version=$(jq -r '.["plugin.version"]' plugin.json)

          if [ -z "$latest_tag" ]; then
            # No release exists use the value from plugin.json's 
            new_version="v${base_version}"
            range=""
          else
            IFS='.' read -r tag_major tag_minor tag_patch <<< "${latest_tag#v}"
            IFS='.' read -r base_major base_minor base_patch <<< "$base_version"

            if [ "$base_major" -gt "$tag_major" ] || { [ "$base_major" -eq "$tag_major" ] && [ "$base_minor" -gt "$tag_minor" ]; }; then
              # plugin.json's major/minor was bumped
              # reseting verion patch count
              new_version="v${base_version}"
            else
              new_version="v${tag_major}.${tag_minor}.$((tag_patch + 1))"
            fi
            range="${latest_tag}..HEAD"
          fi

          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          range="${{ steps.version.outputs.range }}"
          if [ -z "$range" ]; then
            git log --pretty=format:"- %s (%h)" > release_notes.md
          else
            git log "$range" --pretty=format:"- %s (%h)" > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "No changes." > release_notes.md
          fi

      - name: Sync plugin.json version
        run: |
          version="${{ steps.version.outputs.new_version }}"
          sed -i "s/\"plugin.version\": \"[^\"]*\"/\"plugin.version\": \"${version#v}\"/" plugin.json

      - name: Package plugin
        run: make dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          body_path: release_notes.md
          files: fan-manager.zip
